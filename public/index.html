<body>
<div class="app">
  <header class="top">
    <div class="bubbles" id="bubbles"></div>
    <div class="brand"><span class="mascot" id="mascot"></span><div><h1>손맛어보</h1><span class="tag">오늘 낚은 물고기로 채우는 나만의 바다 도감</span></div></div>
    <button class="lvchip" id="lvchip" type="button" aria-label="내 레벨 보기"></button>

    <section id="v-reg" hidden></section>

</div>

<div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
